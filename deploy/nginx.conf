server {
    listen 80;
    listen [::]:80;
    server_name rasd.alsuhaibi96.com;

    gzip on;
    gzip_types text/css application/javascript application/json application/geo+json image/svg+xml;
    gzip_min_length 1024;

    # Server-Sent Events: no buffering, long-lived connection.
    location = /api/stream {
        proxy_pass http://127.0.0.1:3107;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        add_header X-Accel-Buffering no;
    }

    location /_next/static/ {
        alias /var/www/rasd/.next/static/;
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3107;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    client_max_body_size 1M;
    access_log /var/log/nginx/rasd-access.log;
    error_log  /var/log/nginx/rasd-error.log;
}
